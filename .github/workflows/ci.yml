name: quality-checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: pip install -e '.[research,dev]'
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src run_pipeline.py scripts
      - name: Test
        run: pytest
