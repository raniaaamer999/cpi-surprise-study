[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cpi-surprise-event-study"
version = "0.1.0"
description = "Study of US CPI surprises and market reactions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "matplotlib>=3.9",
  "numpy>=2.0",
  "openpyxl>=3.1",
  "pandas>=2.2",
]

[project.scripts]
analyze-cpi-reactions = "macro_surprise.analysis.statistical_analysis:main"
build-cpi-event-dataset = "macro_surprise.analysis.build_event_dataset:main"
clean-bloomberg-cpi = "macro_surprise.data.bloomberg_cpi:main"
download-market-data = "macro_surprise.data.market_client:main"

[project.optional-dependencies]
research = [
  "scipy>=1.14",
  "statsmodels>=0.14",
]
dev = [
  "pytest>=8.3",
  "ruff>=0.7",
  "mypy>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/macro_surprise"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
